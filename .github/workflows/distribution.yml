name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate distribution
        run: python scripts/build_distribution.py --check
      - name: Test packaging
        run: python -m unittest discover -s tests -v
      - name: Build chat bundle
        run: python scripts/build_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: mindandhealth-publish-chat
          path: dist/mindandhealth-publish-claude-ai.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("plugins/mindandhealth-publish/plugin.json").read_text())["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag and manifest version differ"
          PY
      - uses: actions/download-artifact@v4
        with:
          name: mindandhealth-publish-chat
          path: dist
      - name: Publish release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/mindandhealth-publish-claude-ai.zip \
            --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
